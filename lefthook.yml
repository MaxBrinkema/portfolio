# Local fast feedback. CI repeats every check because hooks can be skipped with --no-verify.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,ts,mjs,cjs,vue,astro,json,md,yml,yaml,css}'
      run: pnpm exec prettier --check {staged_files}
    - name: lint
      glob: '*.{js,ts,mjs,cjs,vue}'
      run: pnpm exec eslint --max-warnings 0 {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
